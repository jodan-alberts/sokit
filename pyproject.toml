[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone-harness"
version = "0.1.0"
description = "A decision-driven agent harness for System One models (iterate, call tools, access external datasources)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
typesafe = ["requests>=2.28"]

[tool.setuptools.packages.find]
include = ["harness*"]
