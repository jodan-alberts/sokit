[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone-harness"
version = "0.1.0"
description = "A decision-driven agent harness for System One models (iterate, call tools, access external datasources)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["system-one", "typesafe", "jev", "agent", "harness", "decision-model", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
typesafe = ["requests>=2.28"]

[tool.setuptools.packages.find]
include = ["harness*"]
